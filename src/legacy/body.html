
<div class="app">
<header>
  <div class="bar gut">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Tanit<small data-t="tagline"></small></span></div>
    <div class="row" id="tools" hidden>
      <button class="ghost sm" id="langBtn"></button>
      <button class="ghost sm" id="bigBtn" aria-pressed="false" aria-label="Agrandir le texte / Larger text">A+</button>
      <a class="avatar" id="acct" href="#compte" hidden></a>
    </div>
  </div>
  <div class="proto gut" role="note" data-t="proto"></div>
</header>

<main class="gut">
<!-- LANGUE -->
<section id="v-lang" class="view" style="display:contents">
  <div class="lang-hero"><span class="mark" aria-hidden="true"></span>
  <h1>Choisissez votre langue<br><span class="muted">Choose your language</span></h1></div>
  <div class="langs">
    <button data-lang="fr">Français</button>
    <button data-lang="en">English</button>
  </div>
</section>

<!-- ACCUEIL -->
<section id="v-accueil" class="view" hidden style="display:contents">
  <h1 data-t="home_h1"></h1>
  <div class="card hero-card">
    <span class="tag" data-t="tag_sim"></span>
    <h2 data-t="home_cap"></h2>
    <div class="big" id="homeCap">—</div>
    <p class="muted small" data-t="home_cap_p"></p>
    <a class="btn" href="#capital" data-t="home_cap_btn"></a>
  </div>
  <div class="card">
    <h2 data-t="home_3"></h2>
    <ul class="list"><li data-t="b1"></li><li data-t="b2"></li><li data-t="b3"></li></ul>
    <details><summary data-t="g_q1"></summary><p data-t="g_a1"></p></details>
    <details><summary data-t="g_q2"></summary><p data-t="g_a2"></p></details>
    <details><summary data-t="g_q3"></summary><p data-t="g_a3"></p></details>
    <details><summary data-t="g_q4"></summary><p data-t="g_a4"></p></details>
  </div>
  <div class="card">
    <h2 data-t="home_vote"></h2>
    <p class="muted small" data-t="home_vote_p"></p>
    <a class="btn ghost" href="#vote" data-t="home_vote_btn"></a>
  </div>
  <div class="card">
    <span class="tag" id="homeTag"></span>
    <h2 data-t="home_aid"></h2>
    <div class="big" id="homeAides">—</div>
    <p class="muted small" data-t="home_aid_p"></p>
    <a class="btn ghost" href="#aides" data-t="home_aid_btn"></a>
  </div>
  <a class="btn ghost" href="#etat" data-t="home_etat"></a>
</section>

<!-- CAPITAL -->
<section id="v-capital" class="view" hidden style="display:contents">
  <h1 data-t="cap_h1"></h1>
  <div class="card">
    <label><span><span data-t="cap_rev"></span> <span id="cRevV"></span></span><input type="range" id="cRev" min="800" max="8000" step="50" value="1450"></label>
    <label><span><span data-t="cap_age"></span> <span id="cAgeV"></span></span><input type="range" id="cAge" min="18" max="63" step="1" value="34"></label>
  </div>
  <div class="card">
    <h2 data-t="cap_at64"></h2>
    <div class="big" id="cTotal"></div>
    <p class="small muted" id="cDetail"></p>
    <div class="bars">
      <div class="barline"><span data-t="cap_with"></span><b id="cT1"></b><div class="track"><div class="fill" id="cB1"></div></div></div>
      <div class="barline"><span data-t="cap_livret"></span><b id="cT2"></b><div class="track"><div class="fill alt" id="cB2"></div></div></div>
    </div>
    <button id="cExplain" class="ghost" data-t="explain"></button>
    <div class="out" id="cOut" aria-live="polite"></div>
    <button id="cSay" class="ghost sm" hidden data-t="listen"></button>
  </div>
  <div class="card">
    <h2 data-t="cap_where"></h2>
    <div class="alloc" role="img" id="allocImg"><i class="c1" style="width:35%"></i><i class="c2" style="width:30%"></i><i class="c3" style="width:20%"></i><i class="c4" style="width:15%"></i></div>
    <div class="legend" id="legend"></div>
    <p class="small muted" data-t="cap_eu"></p>
  </div>
  <div class="card">
    <span class="tag" data-t="tag_ex"></span>
    <h2 data-t="rel_h"></h2>
    <p class="small muted" data-t="rel_p"></p>
    <div class="legend" id="relTable"></div>
    <button id="relBtn" class="ghost" data-t="rel_btn"></button>
    <div class="out" id="relOut" aria-live="polite"></div>
    <button id="relSay" class="ghost sm" hidden data-t="listen"></button>
  </div>
  <p class="small muted" data-t="cap_hyp"></p>
</section>

<!-- VOTE -->
<section id="v-vote" class="view" hidden style="display:contents">
  <h1 data-t="vote_h1"></h1>
  <p class="muted" data-t="vote_intro"></p>
  <div class="card">
    <h2 id="v1h" data-t="v1_q"></h2>
    <div class="row" style="justify-content:space-between"><b><span data-t="v1_a"></span> <span id="vA"></span></b><b><span data-t="v1_b"></span> <span id="vB"></span></b></div>
    <input type="range" id="vR" aria-labelledby="v1h" min="0" max="100" step="5" value="50">
  </div>
  <div class="card">
    <h2 data-t="v2_q"></h2>
    <div class="opts" id="v2"></div>
  </div>
  <div class="card">
    <h2 data-t="v3_q"></h2>
    <div class="opts" id="v3"></div>
  </div>
  <div class="card">
    <button id="vExplain" class="ghost" data-t="vote_explain"></button>
    <div class="out" id="vOut" aria-live="polite"></div>
    <button id="vGo" data-t="vote_go"></button>
    <p class="small" id="vDone" hidden><span class="tag ok" data-t="vote_ok"></span> <span data-t="vote_done"></span></p>
  </div>
</section>

<!-- AIDES -->
<section id="v-aides" class="view" hidden style="display:contents">
  <h1 data-t="aid_h1"></h1>
  <div class="card">
    <h2 data-t="aid_s1"></h2>
    <label class="btn ghost" for="doc" data-t="aid_photo"></label>
    <input class="sr" type="file" id="doc" accept="image/*">
    <p class="small muted" id="docMsg" data-t="aid_photo_p"></p>
    <div class="grid2">
      <label><span data-t="f_rev"></span><input type="number" id="pRev" inputmode="numeric" min="0" value="1450"></label>
      <label><span data-t="f_loyer"></span><input type="number" id="pLoyer" inputmode="numeric" min="0" value="620"></label>
      <label><span data-t="f_age"></span><input type="number" id="pAge" inputmode="numeric" min="18" max="110" value="34"></label>
      <label><span data-t="f_enf"></span><input type="number" id="pEnf" inputmode="numeric" min="0" value="1"></label>
    </div>
    <label><span data-t="f_vie"></span><select id="pSit"><option value="seul" data-t="o_seul"></option><option value="couple" data-t="o_couple"></option></select></label>
    <label><span data-t="f_act"></span><select id="pAct"><option value="salarié" data-t="o_sal"></option><option value="indépendant" data-t="o_ind"></option><option value="sans emploi" data-t="o_chom"></option><option value="étudiant" data-t="o_etu"></option><option value="retraité" data-t="o_ret"></option></select></label>
    <button id="findBtn" data-t="aid_find"></button>
    <p class="small muted" id="findMsg" aria-live="polite"></p>
  </div>
  <h2><span data-t="aid_s2"></span> <span class="tag" id="resTag"></span></h2>
  <div id="aidList" style="display:contents"></div>
  <div class="card" id="dossier" hidden>
    <h2 id="dosTitle"></h2>
    <div class="out" id="dosOut" aria-live="polite"></div>
    <div class="row"><button id="dosOk" class="grow" data-t="dos_ok"></button><button id="dosSay" class="ghost sm" hidden data-t="listen"></button></div>
    <p class="small" id="dosDone" hidden><span class="tag ok" data-t="dos_tag"></span> <span data-t="dos_done"></span></p>
  </div>
</section>

<!-- ASSISTANT -->
<section id="v-assistant" class="view" hidden style="display:contents">
  <h1 data-t="ask_h1"></h1>
  <div class="chips" id="chips"></div>
  <div id="chat" style="display:flex;flex-direction:column;gap:.6rem" aria-live="polite"></div>
  <div class="card">
    <label><span data-t="ask_label"></span><textarea id="q" rows="2"></textarea></label>
    <div class="row"><button id="send" class="grow" data-t="ask_send"></button><button id="stop" class="ghost sm" hidden data-t="ask_stop"></button></div>
    <p class="small muted" id="aiMsg"></p>
  </div>
</section>

<!-- DÉCIDEURS -->
<section id="v-etat" class="view" hidden style="display:contents">
  <h1 data-t="et_h1"></h1>
  <p class="muted" data-t="et_intro"></p>
  <div class="card">
    <label><span><span data-t="et_coll"></span> <span id="eCV"></span></span><input type="range" id="eC" min="15" max="25" step="1" value="20"></label>
    <h2 data-t="et_stock"></h2>
    <div class="bars" id="eBars"></div>
    <p class="small muted" data-t="et_stock_p"></p>
  </div>
  <div class="card">
    <h2 data-t="et_euro"></h2>
    <p class="small muted" data-t="et_euro_p"></p>
    <div class="opts">
      <label class="opt"><input type="checkbox" id="k1" checked><span data-t="k1"></span></label>
      <label class="opt"><input type="checkbox" id="k2" checked><span data-t="k2"></span></label>
      <label class="opt"><input type="checkbox" id="k3" checked><span data-t="k3"></span></label>
      <label class="opt"><input type="checkbox" id="k4" checked><span data-t="k4"></span></label>
    </div>
    <p><span class="tag" id="eTag"></span></p>
    <button id="eBtn" class="ghost" data-t="et_btn"></button>
    <div class="out" id="eOut" aria-live="polite"></div>
    <p class="small muted" data-t="et_warn"></p>
  </div>
  <a class="btn ghost" href="#accueil" data-t="back"></a>
</section>

<!-- PRÉSENTATION -->
<section id="v-intro" class="view" hidden style="display:contents">
  <div class="slide-art" id="introArt" aria-hidden="true"></div>
  <div class="dots" id="introDots" aria-hidden="true"><i></i><i></i><i></i></div>
  <h1 id="introH"></h1>
  <p class="muted" id="introP"></p>
  <button id="introNext"></button>
  <button class="link" id="introSkip" data-t="skip" style="align-self:center"></button>
</section>

<!-- CONNEXION -->
<section id="v-login" class="view" hidden style="display:contents">
  <h1 data-t="lg_h1"></h1>
  <p class="muted" data-t="lg_p"></p>
  <div class="card">
    <button id="fcBtn"><span class="btn-sub"><span data-t="lg_fc"></span><small data-t="lg_fc_sub"></small></span></button>
    <div class="divider" data-t="or"></div>
    <label><span data-t="lg_mail"></span><input type="email" id="mail" autocomplete="email" inputmode="email" placeholder="camille@exemple.fr"></label>
    <button class="ghost" id="mailBtn" data-t="lg_send"></button>
    <div id="codeBox" hidden style="display:contents">
      <label><span data-t="lg_code"></span><input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label>
      <p class="small muted" data-t="lg_code_hint"></p>
      <button id="codeBtn" data-t="lg_ok"></button>
    </div>
    <p class="small" id="lgMsg" aria-live="polite"></p>
  </div>
  <button class="link" id="demoBtn" data-t="lg_demo" style="align-self:center"></button>
  <p class="small muted" data-t="lg_note"></p>
</section>

<!-- CONSENTEMENT -->
<section id="v-consent" class="view" hidden style="display:contents">
  <h1 data-t="cs_h1"></h1>
  <p class="muted" data-t="cs_p"></p>
  <div class="card" id="csList"></div>
  <button id="csAll" data-t="cs_all"></button>
  <button class="ghost" id="csSave" data-t="cs_save"></button>
  <a class="btn ghost" href="#politique" data-t="read_policy"></a>
</section>

<!-- COMPTE -->
<section id="v-compte" class="view" hidden style="display:contents">
  <div class="card"><div class="profile"><span class="avatar lg" id="pAv"></span><div><h2 id="pName"></h2><p class="small muted" id="pMeta"></p></div></div></div>

  <h2 data-t="ac_dos"></h2>
  <div id="dosList" style="display:contents"></div>

  <h2 data-t="ac_priv"></h2>
  <div class="card">
    <div id="acCons"></div>
    <details><summary data-t="ac_data"></summary><div class="out" id="acData"></div></details>
    <a class="btn ghost" href="#politique" data-t="read_policy"></a>
    <button class="danger" id="wipeBtn" data-t="ac_wipe"></button>
    <div id="wipeBox" hidden style="display:contents">
      <p class="small" data-t="ac_wipe_q"></p>
      <div class="row"><button class="danger solid grow" id="wipeYes" data-t="ac_wipe_yes"></button><button class="ghost grow" id="wipeNo" data-t="cancel"></button></div>
    </div>
  </div>

  <h2 data-t="ac_pref"></h2>
  <div class="card">
    <b data-t="ac_lang"></b><div class="seg" id="segLang"><button data-v="fr">Français</button><button data-v="en">English</button></div>
    <b data-t="ac_size"></b><div class="seg" id="segSize"><button data-v="">A</button><button data-v="big">A+</button></div>
  </div>

  <h2 data-t="ac_help"></h2>
  <div class="card">
    <details><summary data-t="lh_q1"></summary><p data-t="lh_a1"></p></details>
    <details><summary data-t="lh_q2"></summary><p data-t="lh_a2"></p></details>
    <details><summary data-t="lh_q3"></summary><p data-t="lh_a3"></p></details>
    <details><summary data-t="lh_q4"></summary><p data-t="lh_a4"></p></details>
  </div>
  <button class="ghost" id="logoutBtn" data-t="logout"></button>
  <p class="small muted" style="text-align:center">Tanit Citoyen · v0.4 · Sciences Po AI Hackathon 2026</p>
</section>

<!-- POLITIQUE DE CONFIDENTIALITÉ -->
<section id="v-politique" class="view" hidden style="display:contents">
  <h1 data-t="po_h1"></h1>
  <p class="muted" data-t="po_intro"></p>
  <div class="card policy" id="poBody"></div>
  <button class="ghost" id="poBack" data-t="back_simple"></button>
</section>
</main>

  <a href="#assistant"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-t="n_ask"></span></a>
</div></nav>
</div>
